name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write   # cosign keyless signing
  packages: write

jobs:
  release:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # the changelog needs history back to the previous tag
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25"
      - uses: sigstore/cosign-installer@v3
      - name: install syft (sbom generation)
        run: curl -sSfL https://get.anchore.io/syft | sudo sh -s -- -b /usr/local/bin
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          # cosign keyless needs the OIDC token — goreleaser picks it up
          COSIGN_EXPERIMENTAL: "true"
