name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      - name: vet
        run: go vet ./...
      - name: test (race detector, coverage)
        run: |
          go test -race -count=1 -coverprofile=cover.out ./...
          go tool cover -func=cover.out | tail -1
      - name: build
        run: go build -o cometcli ./cmd/cometcli
      - name: smoke
        run: |
          ./cometcli --help && ./cometcli doctor --help && ./cometcli one --help
          ./cometcli config show
          # no provider configured: headless mode must fail fast, not hang
          ! ./cometcli -p "hi" </dev/null

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12.2
