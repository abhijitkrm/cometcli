version: 2
project_name: cometcli

before:
  hooks:
    - go mod tidy
    - go generate ./...

builds:
  - main: ./cmd/cometcli
    binary: cometcli
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X github.com/abhijitkrm/cometcli/internal/cli.Version={{.Version}}
    goos: [linux, darwin]
    goarch: [amd64, arm64]

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files: [LICENSE, README.md]

checksum:
  name_template: "checksums.txt"

sboms:
  - artifacts: archive

# Homebrew tap — REQUIRES github.com/abhijitkrm/homebrew-tap to exist and a
# HOMEBREW_TAP_TOKEN secret (PAT with repo scope) in the release workflow.
# Uncomment once both are in place; until then the publish step would fail.
# brews:
#   - name: cometcli
#     repository:
#       owner: abhijitkrm
#       name: homebrew-tap
#       token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
#     directory: Formula
#     homepage: https://github.com/abhijitkrm/cometcli
#     description: "Agentic SRE terminal for Cosmos-EVM validators"
#     license: Apache-2.0
#     test: |
#       system "#{bin}/cometcli version"

# cosign keyless signing — runs inside the pipeline so signatures ship
# with the release artifacts (requires cosign on PATH)
signs:
  - cmd: cosign
    args:
      - sign-blob
      - --yes
      - --output-signature
      - ${artifact}.sig
      - --output-certificate
      - ${artifact}.pem
      - ${artifact}
    artifacts: checksum
    output: true

release:
  name_template: "v{{ .Version }}"
  header: |
    ## cometcli v{{ .Version }}

    An agentic SRE terminal for Cosmos-EVM validators — deterministic CLI,
    live TUI, optional AI agent, fleet ops, runbooks, and alerting.

    Install:
      curl -fsSL https://raw.githubusercontent.com/abhijitkrm/cometcli/main/scripts/install.sh | bash

    Verify: docs/INSTALL.md (checksums + cosign keyless signature).

changelog:
  use: git
  sort: asc
  filters:
    exclude:
      - "^Merge"
      - "^\\["
      - "Generated with"
      - "Co-Authored-By"
      - "^chore"
      - "add image"
  groups:
    - title: "Bug fixes"
      regexp: "(?i)(fix|repair|correct|broke|broken)"
      order: 0
    - title: "Documentation"
      regexp: "^(docs|readme|install-doc)[^:]*:"
      order: 1
    - title: "Features"
      regexp: "^[^:]+:"
      order: 2
    - title: "Other"
      order: 999
