version: 2
project_name: cometcli

before:
  hooks:
    - go mod tidy
    - go generate ./...

builds:
  - main: ./cmd/cometcli
    binary: cometcli
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X github.com/abhijitkrm/cometcli/internal/cli.Version={{.Version}}
    goos: [linux, darwin]
    goarch: [amd64, arm64]

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files: [LICENSE, README.md]

checksum:
  name_template: "checksums.txt"

sboms:
  - artifacts: archive

changelog:
  use: github
  sort: asc
