version: "2"

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
  exclusions:
    rules:
      # fmt.Fprint*/Sscan* on strings.Builder/stdout — can't meaningfully fail
      - linters: [errcheck]
        text: "Error return value of `fmt\\.(Fprint|Fprintln|Fprintf|Sscan|Sscanf)`"
      # deferred closes on read-only paths; audit/logger close at shutdown
      - linters: [errcheck]
        text: "Error return value of `[^`]*\\.Close` is not checked"
      - linters: [errcheck]
        path: _test\.go

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
