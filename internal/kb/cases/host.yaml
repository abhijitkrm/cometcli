- id: host-disk-full
  title: Disk full or nearly full on the node data volume
  explains: [node-process-down, node-rpc-down, node-crash-loop, node-stalled, node-catching-up, node-killed-sigkill, node-restarted-recently, node-blocksync-slow, evm-rpc-down, val-in-set-while-syncing, node-behind-but-not-reporting, val-jailed-downtime, val-jailed-waiting-period, val-not-signing, val-jail-imminent, val-signing-degraded, state-db-corrupt, host-disk-high, host-disk-free-low]
  severity: critical
  match:
    any: ["host.disk_used_pct >= 95", "logs.disk_io > 0"]
  confirm:
    - "bash: df -h <home>; du -sh <home>/data/* (largest dirs)"
  causes:
    - unpruned state (app.pruning=nothing/default on a validator), old snapshots, huge logs, cosmovisor backups
  fix:
    - "[read] snap.prune advice; snap.list"
    - "[change] remove old snapshots / rotated logs / cosmovisor backup dirs (operator confirms each delete)"
    - "[change] set app.toml pruning=custom (keep-recent 100, interval 10) for validators; restart"
    - "[change] longer-term: grow the volume"
  verify:
    - "host.disk_used_pct < 85"
  warnings:
    - never delete data/priv_validator_state.json or anything under config/
    - never delete application.db/blockstore.db on a validator to free space
  test:
    signals: {host.disk_used_pct: 98}

- id: host-disk-high
  title: Disk usage high (80-95%)
  severity: medium
  match:
    all: ["host.disk_used_pct >= 80", "host.disk_used_pct < 95"]
  fix:
    - "[read] snap.prune; du of data dirs"
    - "[change] plan pruning / cleanup / resize before it fills"
  test:
    signals: {host.disk_used_pct: 88}

- id: host-inodes-exhausted
  title: Inodes exhausted
  explains: [node-process-down, node-rpc-down, node-crash-loop, node-stalled, node-catching-up, node-killed-sigkill, node-restarted-recently, node-blocksync-slow, evm-rpc-down, val-in-set-while-syncing, node-behind-but-not-reporting, val-jailed-downtime, val-jailed-waiting-period, val-not-signing, val-jail-imminent, val-signing-degraded]
  severity: critical
  match:
    all: ["host.inode_used_pct >= 95"]
  confirm:
    - "bash: df -i; find <home> -xdev -type f | cut -d/ -f1-5 | sort | uniq -c | sort -n | tail"
  fix:
    - "[change] remove the directory with millions of small files (often old snapshot chunks or wasm cache)"
  test:
    signals: {host.inode_used_pct: 100}

- id: host-oom-killed
  title: Node killed for out-of-memory
  explains: [node-process-down, node-rpc-down, node-crash-loop, node-stalled, node-catching-up, node-killed-sigkill, node-restarted-recently, node-blocksync-slow, evm-rpc-down, val-in-set-while-syncing, node-behind-but-not-reporting, val-jailed-downtime, val-jailed-waiting-period, val-not-signing, val-jail-imminent, val-signing-degraded, host-memory-pressure]
  severity: critical
  match:
    any: ["proc.oom_killed == true", "logs.oom > 0", "proc.oom_kills > 0"]
  confirm:
    - "bash: dmesg -T | grep -i oom (or journalctl -k); host.mem_used_pct"
  causes:
    - too little RAM, iavl cache too large, large query load on a validator (API/gRPC open), memory leak in a version
  fix:
    - "[change] lower app.toml iavl-cache-size, disable public API/gRPC on validators, add swap as a stopgap, add RAM"
    - "[change] node.service restart"
  verify:
    - "proc.running and memory stable for an hour"
  test:
    signals: {proc.oom_killed: true}

- id: host-memory-pressure
  title: Memory pressure (>90% used)
  severity: medium
  match:
    all: ["host.mem_used_pct >= 90"]
  fix:
    - "[read] bash: ps aux --sort=-rss | head"
    - "[change] reduce caches / other processes; add RAM"
  test:
    signals: {host.mem_used_pct: 94}

- id: host-overloaded
  title: Host CPU overloaded
  explains: [node-consensus-timeouts, val-signing-degraded, node-blocksync-slow]
  severity: medium
  match:
    all: ["host.load_per_cpu >= 2"]
  fix:
    - "[read] bash: top -bn1 | head -20"
    - "[change] move other workloads off the validator host"
  test:
    signals: {host.load_per_cpu: 3.5}

- id: host-clock-unsynced
  title: System clock not NTP-synchronized
  explains: [node-consensus-timeouts, val-signing-degraded, val-jail-imminent]
  severity: high
  match:
    all: ["clock.ntp_synced == false"]
  confirm:
    - "bash: timedatectl; chronyc tracking"
  fix:
    - "[change] enable chrony/systemd-timesyncd: timedatectl set-ntp true"
  verify:
    - "clock.ntp_synced true"
  test:
    signals: {clock.ntp_synced: false}

- id: host-too-many-files
  title: Too many open files
  explains: [node-process-down, node-rpc-down, node-crash-loop, node-stalled, node-catching-up, node-killed-sigkill, node-restarted-recently, node-blocksync-slow, evm-rpc-down, val-in-set-while-syncing, node-behind-but-not-reporting, val-jailed-downtime, val-jailed-waiting-period, val-not-signing, val-jail-imminent, val-signing-degraded, node-low-peers, node-no-peers]
  severity: high
  match:
    all: ["logs.too_many_files > 0"]
  confirm:
    - "bash: cat /proc/$(pgrep -f <binary>)/limits | grep 'open files'"
  fix:
    - "[change] systemd: LimitNOFILE=65535 in the unit; docker: --ulimit nofile=65535:65535; restart"
  test:
    signals: {logs.too_many_files: 10}

- id: host-port-in-use
  title: Node can't bind a port (address already in use)
  explains: [node-process-down, node-rpc-down, node-crash-loop, node-stalled, node-catching-up, node-killed-sigkill, node-restarted-recently, node-blocksync-slow, evm-rpc-down, val-in-set-while-syncing, node-behind-but-not-reporting, val-jailed-downtime, val-jailed-waiting-period, val-not-signing, val-jail-imminent, val-signing-degraded]
  severity: high
  match:
    all: ["logs.port_in_use > 0"]
  confirm:
    - "bash: ss -ltnp | grep -E '26656|26657|9090|1317|8545'"
  causes:
    - a second instance of the node running, another service on the port
  fix:
    - "[change] stop the duplicate (CHECK it is not a second validator instance with the same key) or change the port"
  warnings:
    - two instances of a validator = double-sign risk; stop one immediately
  test:
    signals: {logs.port_in_use: 2}

- id: container-memory-limit
  title: Container memory limit too low for the node (OOM kills inside the container)
  explains: [node-crash-loop, node-process-down, node-rpc-down, node-restarted-recently, node-killed-sigkill, host-oom-killed, val-jailed-downtime, val-jailed-waiting-period, val-not-signing, val-jail-imminent, node-catching-up, evm-rpc-down, val-in-set-while-syncing]
  severity: critical
  symptoms: restarts with no error in the logs; docker OOMKilled may be false because the node runs under a wrapper shell
  match:
    all: ["proc.mem_limit_mb < 4096"]
    any: ["proc.oom_kills > 0", "proc.mem_used_pct_of_limit >= 90", "proc.restarts >= 3"]
  confirm:
    - "docker inspect -f '{{.HostConfig.Memory}}' <container> (bytes; 0 = unlimited) and docker stats --no-stream"
    - "a node needs several GB under load — a limit of a few hundred MB will always be killed"
  causes:
    - memory limit set in compose (mem_limit / deploy.resources.limits.memory) or with docker update
  fix:
    - "[change] raise or remove the limit: docker update --memory <N>g --memory-swap <N>g <container> (and fix compose so it survives recreation)"
    - "[change] restart the container if it's not recovering on its own"
  verify:
    - "proc.restarts stops increasing; proc.mem_used_pct_of_limit well below 90; wait.until synced"
  playbook:
    - {do: bash, args: {command: "docker update --memory 4g --memory-swap 4g {unit}", description: "raise the container memory limit to 4 GB"}, note: "raise the memory limit (also fix it in compose so it survives recreation)"}
    - {do: node.service, args: {action: restart}, note: "restart with the new limit"}
    - {do: wait.until, args: {condition: synced, timeout: 1800}, note: "wait until it has caught up"}
    - {do: wait.until, args: {condition: unjailable, timeout: 1800}, when: "val.jailed == true", note: "wait out the jail period"}
    - {do: val.unjail, when: "val.jailed == true", note: "unjail (asks you)"}
  test:
    signals: {proc.mem_limit_mb: 120, proc.oom_kills: 14, proc.restarts: 7}

- id: node-home-permission-denied
  title: The node can't write its home (permission denied)
  explains: [node-process-down, node-crash-loop, node-rpc-down, evm-rpc-down, node-restarted-recently, val-jailed-downtime, val-jailed-waiting-period, val-not-signing, val-jail-imminent, val-signing-degraded]
  severity: critical
  symptoms: 'exits at start with "mkdir data: permission denied" or "could not create directory"'
  match:
    all: ["logs.permission_denied > 0"]
    any: ["proc.running == false", "proc.restarts >= 1", "logs.startup_error > 0", "logs.panic > 0"]
  confirm:
    - "node.logs — the panic names the path it couldn't create"
    - "bash: ls -ld <home> <home>/data; docker inspect -f '{{.Config.User}} {{.Config.WorkingDir}}' <container>"
  causes:
    - the container runs as a user that doesn't own the bind-mounted home (a root-owned disk, a home created by sudo)
    - the container's working directory isn't writable by that user — evmd creates data/ relative to it
  fix:
    - "[change] give the home to the node's user once: sudo chown -R <uid>:<gid> <home> (not sudo for the node itself)"
    - "[change] run the container with working_dir (and HOME) set to the node home — node provision writes compose files that way"
    - "[change] recreate the container: docker compose up -d --force-recreate"
  verify:
    - "proc.running true and stays up; wait.until synced"
  warnings:
    - don't run the node or the setup as root to get past it — files it writes become unwritable for the real user next time
  test:
    signals: {logs.permission_denied: 2, proc.running: false, logs.panic: 1}
