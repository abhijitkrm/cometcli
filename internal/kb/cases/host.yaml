- id: host-disk-full
  title: Disk full or nearly full on the node data volume
  plain: "The disk is full, so the node can't write blocks and stops."
  explains: [node-process-down, node-rpc-down, node-crash-loop, node-stalled, node-catching-up, node-killed-sigkill, node-restarted-recently, node-blocksync-slow, evm-rpc-down, val-in-set-while-syncing, node-behind-but-not-reporting, val-jailed-downtime, val-jailed-waiting-period, val-not-signing, val-jail-imminent, val-signing-degraded, state-db-corrupt, host-disk-high, host-disk-free-low, node-no-peers, node-low-peers]
  severity: critical
  match:
    any: ["host.disk_used_pct >= 95", "logs.disk_io > 0"]
  confirm:
    - "bash: df -h <home>; du -xh -d 3 of the whole filesystem and files over 1G — the space can be outside the node home"
  causes:
    - unpruned state (app.pruning=nothing/default on a validator), old snapshots, huge logs, cosmovisor backups
    - something else on the same filesystem (docker images and logs, backups, a stray large file)
  fix:
    - "[read] snap.prune advice; snap.list"
    - "[change] remove old snapshots / rotated logs / cosmovisor backup dirs / the large files found (operator confirms each delete)"
    - "[change] once space is free, restart the node (node.service restart): a node that hit a full disk freezes — RPC up, no new blocks, nothing logged — and stays frozen after space returns"
    - "[change] set app.toml pruning=custom (keep-recent 100, interval 10) for validators; restart"
    - "[change] longer-term: grow the volume, or move the node home to its own volume"
  verify:
    - "host.disk_used_pct < 85"
  warnings:
    - never delete data/priv_validator_state.json or anything under config/
    - never delete application.db/blockstore.db on a validator to free space
  playbook_kind: report
  playbook:
    - {do: bash, args: {command: "h={sig:node.host_home}; df -h $h; m=$(findmnt -no TARGET --target $h 2>/dev/null || echo /); if sudo -n true 2>/dev/null; then S='sudo -n'; else S=; fi; echo \"largest dirs on $m:\"; timeout 60 $S du -xh -d 3 $m 2>/dev/null | sort -h | tail -12; echo 'files over 1G:'; timeout 60 $S find $m -xdev -type f -size +1G -printf '%s\\t%p\\n' 2>/dev/null | sort -n | tail -8 | numfmt --to=iec --field=1", description: "what fills the disk (the whole filesystem, not just the node home)"}, note: "where the space goes — anything on the filesystem, not only the node data"}
    - {do: snap.prune, note: "pruning advice"}
  test:
    signals: {host.disk_used_pct: 98}

- id: host-disk-high
  title: Disk usage high (80-95%)
  severity: medium
  match:
    all: ["host.disk_used_pct >= 80", "host.disk_used_pct < 95"]
  fix:
    - "[read] snap.prune; du of data dirs"
    - "[change] plan pruning / cleanup / resize before it fills"
  playbook_kind: report
  playbook:
    - {do: bash, args: {command: "h={sig:node.host_home}; df -h $h; m=$(findmnt -no TARGET --target $h 2>/dev/null || echo /); if sudo -n true 2>/dev/null; then S='sudo -n'; else S=; fi; echo \"largest dirs on $m:\"; timeout 60 $S du -xh -d 3 $m 2>/dev/null | sort -h | tail -12; echo 'files over 1G:'; timeout 60 $S find $m -xdev -type f -size +1G -printf '%s\\t%p\\n' 2>/dev/null | sort -n | tail -8 | numfmt --to=iec --field=1", description: "what fills the disk (the whole filesystem, not just the node home)"}, note: "where the space goes — anything on the filesystem, not only the node data"}
    - {do: snap.prune, note: "pruning advice"}
  test:
    signals: {host.disk_used_pct: 88}

- id: host-inodes-exhausted
  title: Inodes exhausted
  plain: "The disk has run out of inodes (file slots), so the node can't create files."
  explains: [node-process-down, node-rpc-down, node-crash-loop, node-stalled, node-catching-up, node-killed-sigkill, node-restarted-recently, node-blocksync-slow, evm-rpc-down, val-in-set-while-syncing, node-behind-but-not-reporting, val-jailed-downtime, val-jailed-waiting-period, val-not-signing, val-jail-imminent, val-signing-degraded, node-no-peers, node-low-peers]
  severity: critical
  match:
    all: ["host.inode_used_pct >= 95"]
  confirm:
    - "bash: df -i; find <home> -xdev -type f | cut -d/ -f1-5 | sort | uniq -c | sort -n | tail"
  fix:
    - "[change] remove the directory with millions of small files (often old snapshot chunks or wasm cache)"
  test:
    signals: {host.inode_used_pct: 100}

- id: host-fs-readonly
  title: Node filesystem went read-only
  plain: "The disk holding the node switched to read-only, usually after disk errors. The node can't write and stops."
  explains: [node-process-down, node-rpc-down, node-crash-loop, node-stalled, node-catching-up, node-restarted-recently, evm-rpc-down, val-not-signing, val-jail-imminent, val-signing-degraded, val-local-privval-errors, state-db-corrupt, host-disk-full]
  severity: critical
  match:
    all: ["host.fs_readonly == true"]
  confirm:
    - "bash: findmnt --target <home>; journalctl -k | grep -iE 'I/O error|EXT4-fs error|read-only'"
  causes:
    - the kernel remounted the filesystem read-only after I/O or filesystem errors (errors=remount-ro)
    - "a failing or detached volume (on a cloud VM: an impaired volume)"
  fix:
    - "[read] read the kernel log for the first error; check the volume's status at the provider"
    - "[change] stop the validator so it can't restart mid-failure (node.service stop)"
    - "[change] move the node to a healthy volume — copy the home, keep data/priv_validator_state.json at its latest — or fsck and remount read-write once the cause is fixed"
  warnings:
    - don't remount read-write without fsck; writes on a failing disk corrupt the databases
    - never start a second copy of the validator elsewhere while this one may still sign
  playbook_kind: report
  playbook:
    - {do: bash, args: {command: "h={sig:node.host_home}; findmnt --target $h; (sudo -n journalctl -k --since -6h -q --no-pager 2>/dev/null || journalctl -k --since -6h -q --no-pager 2>/dev/null) | grep -iE 'I/O error|EXT4-fs|XFS|BTRFS|read-only|nvme' | tail -15", description: "the mount and the kernel's disk errors"}, note: "why it went read-only"}
  test:
    signals: {host.fs_readonly: true}

- id: host-disk-io-errors
  title: Kernel reports disk I/O errors
  plain: "The kernel logged disk errors in the last hour: the disk is failing or was detached."
  explains: [node-process-down, node-rpc-down, node-crash-loop, node-stalled, node-blocksync-slow, node-restarted-recently, state-db-corrupt, val-signing-degraded, val-not-signing]
  severity: critical
  match:
    all: ["host.kernel_disk_errors > 0"]
  confirm:
    - "bash: journalctl -k --since -1h | grep -iE 'I/O error|EXT4-fs error|nvme'"
  causes:
    - failing disk or controller; a cloud volume that is impaired or was detached
    - filesystem corruption after an unclean shutdown
  fix:
    - "[read] which device and how often; the volume's status at the provider"
    - "[change] move the node to a healthy volume before it fails outright (keep data/priv_validator_state.json at its latest)"
  warnings:
    - expect database corruption on a disk with I/O errors; restore from a snapshot rather than trusting the data
  playbook_kind: report
  playbook:
    - {do: bash, args: {command: "(sudo -n journalctl -k --since -1h -q --no-pager 2>/dev/null || journalctl -k --since -1h -q --no-pager 2>/dev/null) | grep -iE 'I/O error|blk_update_request|medium error|EXT4-fs error|XFS|BTRFS|read-only|nvme' | tail -15; findmnt --target {sig:node.host_home}", description: "the kernel's disk errors"}, note: "which device is failing"}
  test:
    signals: {host.kernel_disk_errors: 7}

- id: host-disk-failing
  title: Disk health check failed
  plain: "The disk's own health check (SMART) reports it is failing."
  severity: critical
  match:
    all: ["host.disk_health_failed == true"]
  confirm:
    - "bash: sudo smartctl -a <device>"
  fix:
    - "[change] replace the disk: move the node to a new one while this one still reads (keep data/priv_validator_state.json at its latest)"
  test:
    signals: {host.disk_health_failed: true}

- id: host-oom-killed
  title: Node killed for out-of-memory
  plain: "The machine ran out of memory and the kernel killed the node."
  explains: [node-process-down, node-rpc-down, node-crash-loop, node-stalled, node-catching-up, node-killed-sigkill, node-restarted-recently, node-blocksync-slow, evm-rpc-down, val-in-set-while-syncing, node-behind-but-not-reporting, val-jailed-downtime, val-jailed-waiting-period, val-not-signing, val-jail-imminent, val-signing-degraded, host-memory-pressure, node-no-peers, node-low-peers]
  severity: critical
  match:
    any: ["proc.oom_killed == true", "logs.oom > 0", "proc.oom_kills > 0"]
  confirm:
    - "bash: dmesg -T | grep -i oom (or journalctl -k); host.mem_used_pct"
  causes:
    - too little RAM, iavl cache too large, large query load on a validator (API/gRPC open), memory leak in a version
  fix:
    - "[change] lower app.toml iavl-cache-size, disable public API/gRPC on validators, add swap as a stopgap, add RAM"
    - "[change] node.service restart"
  verify:
    - "proc.running and memory stable for an hour"
  test:
    signals: {proc.oom_killed: true}

- id: host-memory-pressure
  title: Memory pressure (>90% used)
  severity: medium
  match:
    all: ["host.mem_used_pct >= 90"]
  fix:
    - "[read] bash: ps aux --sort=-rss | head"
    - "[change] reduce caches / other processes; add RAM"
  playbook_kind: report
  playbook:
    - {do: bash, args: {command: "uptime; free -m; ps aux --sort=-%cpu | head -8; ps aux --sort=-rss | head -6", description: "what uses the host"}, note: "who uses the CPU and memory"}
  test:
    signals: {host.mem_used_pct: 94}

- id: host-overloaded
  title: Host CPU overloaded
  explains: [node-consensus-timeouts, val-signing-degraded, node-blocksync-slow]
  severity: medium
  match:
    all: ["host.load_per_cpu >= 2"]
  fix:
    - "[read] bash: top -bn1 | head -20"
    - "[change] move other workloads off the validator host"
  playbook_kind: report
  playbook:
    - {do: bash, args: {command: "uptime; free -m; ps aux --sort=-%cpu | head -8; ps aux --sort=-rss | head -6", description: "what uses the host"}, note: "who uses the CPU and memory"}
  test:
    signals: {host.load_per_cpu: 3.5}

- id: host-clock-unsynced
  title: System clock not NTP-synchronized
  plain: "The machine's clock isn't synced, which can break consensus timing."
  explains: [node-consensus-timeouts, val-signing-degraded, val-jail-imminent]
  severity: high
  match:
    all: ["clock.ntp_synced == false"]
  confirm:
    - "bash: timedatectl; chronyc tracking"
  fix:
    - "[change] enable chrony/systemd-timesyncd: timedatectl set-ntp true"
  verify:
    - "clock.ntp_synced true"
  playbook:
    - {do: bash, args: {command: "sudo -n timedatectl set-ntp true && timedatectl show -p NTPSynchronized", description: "turn on NTP time sync"}, note: "needs passwordless sudo"}
    - {do: wait.until, args: {condition: signal, value: "clock.ntp_synced == true", timeout: 300}, note: "wait for the clock to sync"}
  test:
    signals: {clock.ntp_synced: false}

- id: host-too-many-files
  title: Too many open files
  plain: "The node hit the open-file limit and can't open more connections or files."
  explains: [node-process-down, node-rpc-down, node-crash-loop, node-stalled, node-catching-up, node-killed-sigkill, node-restarted-recently, node-blocksync-slow, evm-rpc-down, val-in-set-while-syncing, node-behind-but-not-reporting, val-jailed-downtime, val-jailed-waiting-period, val-not-signing, val-jail-imminent, val-signing-degraded, node-low-peers, node-no-peers]
  severity: high
  match:
    all: ["logs.too_many_files > 0"]
  confirm:
    - "bash: cat /proc/$(pgrep -f <binary>)/limits | grep 'open files'"
  fix:
    - "[change] systemd: LimitNOFILE=65535 in the unit; docker: --ulimit nofile=65535:65535; restart"
  test:
    signals: {logs.too_many_files: 10}

- id: host-port-in-use
  title: Node can't bind a port (address already in use)
  plain: "Another process holds a port the node needs, so it can't start."
  explains: [node-process-down, node-rpc-down, node-crash-loop, node-stalled, node-catching-up, node-killed-sigkill, node-restarted-recently, node-blocksync-slow, evm-rpc-down, val-in-set-while-syncing, node-behind-but-not-reporting, val-jailed-downtime, val-jailed-waiting-period, val-not-signing, val-jail-imminent, val-signing-degraded, node-no-peers, node-low-peers]
  severity: high
  match:
    # the node's own log, or docker refusing to start the container
    any: ["logs.port_in_use > 0", "proc.port_taken > 0"]
  confirm:
    - "bash: ss -ltnp | grep -E '26656|26657|9090|1317|8545'"
  causes:
    - a second instance of the node running, another service on the port
  fix:
    - "[change] stop the duplicate (CHECK it is not a second validator instance with the same key) or change the port"
  warnings:
    - two instances of a validator = double-sign risk; stop one immediately
  playbook_kind: report
  playbook:
    - {do: bash, args: {command: "docker ps --filter publish={sig:proc.port_taken} --format '{{.Names}} (image {{.Image}}, up {{.RunningFor}})'", description: "the container holding the port"}, when: "proc.port_taken > 0", note: "who holds the port (docker refused to start the node)"}
    - {do: bash, args: {command: "ss -ltnp 2>/dev/null | grep -E ':(26656|26657|26660|1317|9090|8545|8546) ' || true", description: "what listens on the node's ports"}, note: "what listens on the node's ports"}
  test:
    signals: {logs.port_in_use: 2}

- id: container-memory-limit
  title: Container memory limit too low for the node (OOM kills inside the container)
  plain: "The container hit its memory limit and was killed."
  explains: [node-crash-loop, node-process-down, node-rpc-down, node-restarted-recently, node-killed-sigkill, host-oom-killed, val-jailed-downtime, val-jailed-waiting-period, val-not-signing, val-jail-imminent, node-catching-up, evm-rpc-down, val-in-set-while-syncing, node-no-peers, node-low-peers]
  severity: critical
  symptoms: restarts with no error in the logs; docker OOMKilled may be false because the node runs under a wrapper shell
  match:
    all: ["proc.mem_limit_mb < 4096"]
    any: ["proc.oom_kills > 0", "proc.mem_used_pct_of_limit >= 90", "proc.restarts >= 3", "proc.mem_limit_mb < 1024"]
  confirm:
    - "docker inspect -f '{{.HostConfig.Memory}}' <container> (bytes; 0 = unlimited) and docker stats --no-stream"
    - "a node needs several GB under load — a limit of a few hundred MB will always be killed"
  causes:
    - memory limit set in compose (mem_limit / deploy.resources.limits.memory) or with docker update
  fix:
    - "[change] raise or remove the limit: docker update --memory <N>g --memory-swap <N>g <container> (and fix compose so it survives recreation)"
    - "[change] restart the container if it's not recovering on its own"
  verify:
    - "proc.restarts stops increasing; proc.mem_used_pct_of_limit well below 90; wait.until synced"
  playbook:
    - {do: bash, args: {command: "docker update --memory 4g --memory-swap 4g {unit}", description: "raise the container memory limit to 4 GB"}, note: "raise the memory limit (also fix it in compose so it survives recreation)"}
    - {do: node.service, args: {action: restart}, note: "restart with the new limit"}
    - {do: wait.until, args: {condition: synced, timeout: 1800}, note: "wait until it has caught up"}
    - {do: wait.until, args: {condition: unjailable, timeout: 1800}, when: "val.jailed == true", note: "wait out the jail period"}
    - {do: val.unjail, when: "val.jailed == true", note: "unjail (asks you)"}
  test:
    signals: {proc.mem_limit_mb: 120, proc.oom_kills: 14, proc.restarts: 7}

- id: node-home-permission-denied
  title: The node can't write its home (permission denied)
  plain: "The node can't read or write its data folder: wrong file ownership or permissions."
  explains: [node-process-down, node-crash-loop, node-rpc-down, evm-rpc-down, node-restarted-recently, val-jailed-downtime, val-jailed-waiting-period, val-not-signing, val-jail-imminent, val-signing-degraded, node-no-peers, node-low-peers]
  severity: critical
  symptoms: 'exits at start with "mkdir data: permission denied" or "could not create directory"'
  match:
    all: ["logs.permission_denied > 0"]
    any: ["proc.running == false", "proc.restarts >= 1", "logs.startup_error > 0", "logs.panic > 0"]
  confirm:
    - "node.logs — the panic names the path it couldn't create"
    - "bash: ls -ld <home> <home>/data; docker inspect -f '{{.Config.User}} {{.Config.WorkingDir}}' <container>"
  causes:
    - the container runs as a user that doesn't own the bind-mounted home (a root-owned disk, a home created by sudo)
    - the container's working directory isn't writable by that user — evmd creates data/ relative to it
  fix:
    - "[change] give the home to the node's user once: sudo chown -R <uid>:<gid> <home> (not sudo for the node itself)"
    - "[change] run the container with working_dir (and HOME) set to the node home — node provision writes compose files that way"
    - "[change] recreate the container: docker compose up -d --force-recreate"
  verify:
    - "proc.running true and stays up; wait.until synced"
  warnings:
    - don't run the node or the setup as root to get past it — files it writes become unwritable for the real user next time
  playbook:
    - {do: bash, args: {command: "sudo -n chown -R \"$(id -u):$(id -g)\" {sig:node.host_home}", description: "give the node home back to its user"}, note: "needs passwordless sudo; otherwise the operator runs it"}
    - {do: node.service, args: {action: start}, note: "start it again"}
    - {do: wait.until, args: {condition: synced, timeout: 1800}, note: "wait until it has caught up"}
    - {do: wait.until, args: {condition: unjailable, timeout: 1800}, when: "val.jailed == true", note: "wait out the jail period"}
    - {do: val.unjail, when: "val.jailed == true", note: "unjail (signed by the operator key — asks you)"}
    - {do: wait.until, args: {condition: in-consensus, timeout: 600}, when: "val.jailed == true", note: "check it signs again"}
  test:
    signals: {logs.permission_denied: 2, proc.running: false, logs.panic: 1}

- id: host-docker-down
  title: Docker isn't running on the node's host
  plain: "Docker isn't running on the host, so the node's container can't run."
  explains: [node-process-down, node-rpc-down, node-crash-loop, node-stalled, node-catching-up, node-killed-sigkill, node-restarted-recently, node-blocksync-slow, evm-rpc-down, val-in-set-while-syncing, node-behind-but-not-reporting, val-jailed-downtime, val-jailed-waiting-period, val-not-signing, val-jail-imminent, val-signing-degraded, node-no-peers, node-low-peers]
  severity: critical
  match:
    all: ["proc.docker_down == true"]
  confirm:
    - "bash: systemctl status docker; docker info"
  causes:
    - the docker service stopped or crashed, or the host rebooted with docker not enabled
  fix:
    - "[change] sudo systemctl start docker (and enable it so a reboot brings it back); start the node"
  playbook:
    - {do: bash, args: {command: "sudo -n systemctl enable --now docker && docker info --format '{{.ServerVersion}}'", description: "start docker and enable it at boot"}, note: "start docker (needs passwordless sudo; otherwise the operator runs it)"}
    - {do: node.service, args: {action: start}, note: "start the node"}
    - {do: wait.until, args: {condition: synced, timeout: 1800}, note: "wait until it has caught up"}
    - {do: wait.until, args: {condition: unjailable, timeout: 1800}, when: "val.jailed == true", note: "wait out the jail period"}
    - {do: val.unjail, when: "val.jailed == true", note: "unjail (signed by the operator key — asks you)"}
    - {do: wait.until, args: {condition: in-consensus, timeout: 600}, when: "val.jailed == true", note: "check it signs again"}
  test:
    signals: {proc.docker_down: true, proc.running: false}

- id: node-image-missing
  title: The node's docker image isn't on the host
  plain: "The node's container image isn't on the host."
  explains: [node-process-down, node-rpc-down, node-crash-loop, node-stalled, node-catching-up, node-killed-sigkill, node-restarted-recently, node-blocksync-slow, evm-rpc-down, val-in-set-while-syncing, node-behind-but-not-reporting, val-jailed-downtime, val-jailed-waiting-period, val-not-signing, val-jail-imminent, val-signing-degraded, node-no-peers, node-low-peers, node-container-missing]
  severity: high
  match:
    all: ["proc.image_present == false"]
  confirm:
    - "bash: docker image inspect <image>; docker inspect -f '{{.State.Error}}' <container>"
  causes:
    - images pruned (docker system prune -a), a new host, or a compose file pointing at a tag never built here
  fix:
    - "[change] upgrade.build the release the image was built from, under the same name; start the node"
  playbook:
    - {do: upgrade.build, args: {tag: "{sig:proc.image_version}", image: "{sig:proc.image}"}, note: "rebuild the image from its official release (asks you; several minutes)"}
    - {do: node.recreate, note: "start the node from its compose file (recreates the container if it's gone)"}
    - {do: wait.until, args: {condition: synced, timeout: 1800}, note: "wait until it has caught up"}
    - {do: wait.until, args: {condition: unjailable, timeout: 1800}, when: "val.jailed == true", note: "wait out the jail period"}
    - {do: val.unjail, when: "val.jailed == true", note: "unjail (signed by the operator key — asks you)"}
  test:
    signals: {proc.image_present: false, proc.running: false, proc.image: "mychain-v0.7.2", proc.image_version: "v0.7.2"}

- id: node-container-missing
  title: The node's container doesn't exist
  plain: "The node's container doesn't exist on the host."
  explains: [node-process-down, node-rpc-down, node-crash-loop, node-stalled, node-catching-up, node-killed-sigkill, node-restarted-recently, node-blocksync-slow, evm-rpc-down, val-in-set-while-syncing, node-behind-but-not-reporting, val-jailed-downtime, val-jailed-waiting-period, val-not-signing, val-jail-imminent, val-signing-degraded, node-no-peers, node-low-peers]
  severity: critical
  match:
    all: ["proc.container_missing == true"]
  confirm:
    - "bash: docker ps -a; ls the node home for its docker-compose.yml"
  causes:
    - docker compose down / docker rm, or the profile names the wrong container
  fix:
    - "[change] docker compose up -d from the node's compose file (node.provision reconfigure=true re-renders it from the spec)"
  playbook:
    - {do: node.recreate, note: "create the container again from the node's compose file (same data dir)"}
    - {do: wait.until, args: {condition: synced, timeout: 1800}, note: "wait until it has caught up"}
    - {do: wait.until, args: {condition: unjailable, timeout: 1800}, when: "val.jailed == true", note: "wait out the jail period"}
    - {do: val.unjail, when: "val.jailed == true", note: "unjail (signed by the operator key — asks you)"}
  test:
    signals: {proc.container_missing: true, proc.running: false}

