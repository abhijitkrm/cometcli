- id: node-rpc-down
  title: Node RPC unreachable (process down or RPC disabled)
  explains: [evm-rpc-down, val-jailed-downtime, val-jailed-waiting-period, val-not-signing, val-jail-imminent, val-signing-degraded]
  severity: critical
  match:
    all: ["node.reachable == false"]
  confirm:
    - "node.health; node.service status"
    - "proc.running and proc.exit_code; node.logs tail"
  causes:
    - process crashed/exited (see logs.panic, logs.config_parse, logs.port_in_use)
    - RPC laddr changed or bound to another interface
    - host unreachable
  fix:
    - "[read] node.logs last 200 lines for the exit reason"
    - "[change] fix the reason, then node.service restart"
  verify:
    - "node.health ok; wait.until synced"
  test:
    signals: {node.reachable: false}

- id: node-process-down
  title: Node process/container not running
  explains: [node-rpc-down, evm-rpc-down, val-jailed-downtime, val-jailed-waiting-period, val-not-signing, val-jail-imminent, val-signing-degraded]
  severity: critical
  match:
    all: ["proc.running == false"]
  confirm:
    - "node.service status; node.logs (last lines before exit); proc.exit_code"
  causes:
    - crash (panic), OOM kill, bad config/flag, port in use, disk full, upgrade halt (exits by design)
  fix:
    - "[read] node.logs to find why it exited — do not restart blindly"
    - "[change] fix the reason; node.service start"
  verify:
    - "proc.running true and stays up >5 min; wait.until synced"
  warnings:
    - an upgrade halt exits on purpose — restarting the old binary re-halts; follow upgrade-halt-binary-missing
  playbook:
    - {do: node.logs, args: {lines: 40}, note: "the last lines before it stopped"}
    - {do: node.service, args: {action: start}, note: "start the node"}
    - {do: wait.until, args: {condition: synced, timeout: 1800}, note: "wait until it has caught up"}
    - {do: wait.until, args: {condition: unjailable, timeout: 1800}, when: "val.jailed == true", note: "wait out the jail period"}
    - {do: val.unjail, when: "val.jailed == true", note: "unjail (signed by the operator key — asks you)"}
    - {do: wait.until, args: {condition: in-consensus, timeout: 600}, when: "val.jailed == true", note: "check it signs again"}
  test:
    signals: {proc.running: false, proc.state: exited}

- id: node-crash-loop
  title: Node crash-looping (restarting repeatedly)
  explains: [node-process-down, node-rpc-down, evm-rpc-down, node-restarted-recently, node-killed-sigkill, node-catching-up, val-jailed-downtime, val-jailed-waiting-period, val-not-signing, val-jail-imminent, val-signing-degraded, val-in-set-while-syncing]
  severity: critical
  match:
    all: ["proc.restarts >= 3", "proc.uptime_s < 600"]
  confirm:
    - "node.logs for the panic/exit message repeated each start"
  causes:
    - panic on a block (app hash / bug → needs a fixed binary), bad config, corrupt DB, upgrade halt with old binary
  fix:
    - "[read] node.logs; kb.search the panic message"
    - "[change] apply the matching fix; stop the restart loop if it makes things worse (node.service stop)"
  test:
    signals: {proc.restarts: 12, proc.uptime_s: 40, logs.panic: 5}

- id: node-catching-up
  title: Node catching up (block sync in progress)
  explains: [val-not-signing, val-jail-imminent, val-signing-degraded]
  severity: medium
  match:
    all: ["node.catching_up == true"]
  confirm:
    - "node.status twice ~30s apart: is the height increasing? how fast?"
  causes:
    - restarted after downtime, restored from snapshot, slow disk/peers
  fix:
    - "[read] wait.until synced (progress shows blocks/s and ETA)"
    - "[change] if far behind (days), consider snap.statesync instead of replaying"
  verify:
    - "node.catching_up false, node.block_age_s < 30"
  playbook:
    - {do: wait.until, args: {condition: synced, timeout: 3600}, note: "nothing is broken — it is catching up; this shows progress and ETA"}
  test:
    signals: {node.catching_up: true, node.block_age_s: 7200}

- id: node-stalled
  title: Node stalled — not catching up but no new blocks
  explains: [val-jailed-downtime, val-jailed-waiting-period, val-not-signing, val-jail-imminent, val-signing-degraded]
  severity: critical
  symptoms: catching_up=false but latest block is minutes old
  match:
    all: ["node.stalled == true"]
  confirm:
    - "node.status twice; node.peers; is the whole chain halted? compare a public RPC (web_fetch <rpc>/status)"
  causes:
    - whole chain halted (upgrade height, consensus failure) — check upgrade.blocks_to_halt, logs.upgrade_needed
    - this node lost peers or is stuck on a bad block / app hash
  fix:
    - "[read] decide: chain-wide halt vs local stall (public RPC height)"
    - "[change] local: fix peers (net.add-peer), restart; chain-wide: follow the chain's coordination channel"
  verify:
    - "node.block_age_s < 30"
  test:
    signals: {node.stalled: true, node.block_age_s: 900, node.catching_up: false}

- id: node-no-peers
  title: Node has no peers
  explains: [node-stalled, node-catching-up, node-blocksync-slow, node-peer-churn, node-p2p-port-exposure, val-jailed-downtime, val-jailed-waiting-period, val-not-signing, val-jail-imminent, val-signing-degraded]
  severity: critical
  match:
    all: ["node.peers == 0"]
  confirm:
    - "node.peers; logs.peer_net / logs.p2p_auth samples; sec.exposure (26656 reachable?)"
  causes:
    - persistent_peers/seeds empty or stale, firewall blocks 26656, wrong chain-id/genesis (peers reject), external_address wrong
  fix:
    - "[read] get current peers from the chain's registry or a public RPC /net_info"
    - "[change] net.add-peer (2-5 healthy peers); node.service restart"
  verify:
    - "node.peers >= 3 and node.block_age_s < 30"
  playbook:
    - {do: net.add-peer, args: {peer: "{peers}"}, note: "peer with the chain's other nodes you run"}
    - {do: node.service, args: {action: restart}, note: "restart so it takes effect"}
    - {do: wait.until, args: {condition: synced, timeout: 1800}, note: "wait until it has caught up"}
  test:
    signals: {node.peers: 0}

- id: node-low-peers
  title: Node has very few peers
  severity: medium
  match:
    all: ["node.peers > 0", "node.peers < 3"]
  fix:
    - "[change] net.add-peer more persistent peers; check config.pex and max_inbound_peers"
  playbook:
    - {do: net.add-peer, args: {peer: "{peers}"}, note: "add the chain's other nodes you run as persistent peers"}
    - {do: node.service, args: {action: restart}, note: "restart so it takes effect"}
    - {do: wait.until, args: {condition: synced, timeout: 1800}, note: "wait until it has caught up"}
  test:
    signals: {node.peers: 1}

- id: node-peer-churn
  title: Heavy peer connection errors
  severity: low
  match:
    all: ["logs.peer_net > 200"]
  confirm:
    - "node.peers count stable? if peers OK this is usually harmless noise"
  fix:
    - "[change] remove dead persistent peers (net.rm-peer) and add healthy ones"
  test:
    signals: {logs.peer_net: 900, node.peers: 8}

- id: node-wrong-network
  title: Peers reject us — different network / genesis
  explains: [node-no-peers, node-low-peers, node-stalled, node-catching-up, node-p2p-port-exposure, val-jailed-downtime, val-jailed-waiting-period, val-not-signing, val-jail-imminent, val-signing-degraded]
  severity: critical
  match:
    any: ["logs.chain_mismatch > 0"]
  confirm:
    - "node.status network vs profile chain_id; sha256 of config/genesis.json vs the official one"
  causes:
    - wrong genesis.json, wrong chain-id in config/client, joined testnet peers on mainnet
  fix:
    - "[read] compare genesis checksum with the chain's official genesis (web_fetch)"
    - "[change] replace genesis with the official one (operator confirms), reset is NOT done by the agent"
  warnings:
    - never run unsafe-reset-all on a validator without the operator — it is refused by cometcli
  test:
    signals: {logs.chain_mismatch: 30, node.peers: 0}

- id: node-p2p-port-exposure
  title: Peers cannot dial us (p2p port not reachable)
  severity: medium
  match:
    all: ["node.peers < 3", "config.pex == true"]
    any: ["logs.p2p_auth > 0", "logs.peer_net > 0"]
  confirm:
    - "sec.exposure — is 26656 listening on a public interface? check external_address in config.toml"
  fix:
    - "[change] set p2p.external_address, open firewall for 26656, restart"
  test:
    signals: {node.peers: 1, config.pex: true, logs.p2p_auth: 20}

- id: node-consensus-timeouts
  title: Consensus round timeouts / slow votes
  severity: medium
  match:
    all: ["logs.clock > 20", "node.catching_up == false"]
  confirm:
    - "node.consensus — round > 0 often? clock.ntp_synced? host.load_per_cpu?"
  causes:
    - clock skew, overloaded host, slow disk, poor connectivity to other validators
  fix:
    - "[change] fix NTP / load / peers; consider a sentry topology"
  test:
    signals: {logs.clock: 50, node.catching_up: false}

- id: node-blocksync-slow
  title: Catching up too slowly to ever reach the tip
  explains: [node-catching-up, val-not-signing, val-jail-imminent]
  severity: high
  match:
    all: ["node.catching_up == true", "node.block_age_s > 86400"]
  confirm:
    - "two node.status calls 60s apart: blocks/s vs chain block rate"
  fix:
    - "[change] snap.statesync (or restore a trusted snapshot) instead of replaying"
    - "[change] faster disk (NVMe), more peers"
  test:
    signals: {node.catching_up: true, node.block_age_s: 400000}

- id: node-network-detached
  title: Node container has no network attached
  explains: [node-rpc-down, node-rpc-path-broken, node-no-peers, node-low-peers, node-stalled, node-catching-up, evm-rpc-down, val-jailed-downtime, val-jailed-waiting-period, val-not-signing, val-jail-imminent]
  severity: critical
  symptoms: process running, but no peers and its published ports are gone
  match:
    all: ["proc.networks == 0", "proc.running == true"]
  confirm:
    - "docker inspect -f '{{json .NetworkSettings.Networks}}' <container> → {}"
    - "which network should it be on? (compose file / the other nodes' docker inspect)"
  causes:
    - docker network disconnect (manual or tooling), network removed/recreated under a running container
  fix:
    - "[change] docker network connect [--ip <its address>] <network> <container> — keep the IP if peers dial it by address"
    - "[change] or recreate it with docker compose up -d <service>"
  verify:
    - "node.reachable true, node.peers >= 2, wait.until synced"
  playbook:
    - {do: node.recreate, note: "recreate the container from its compose file — reattaches its network"}
    - {do: wait.until, args: {condition: synced, timeout: 1800}, note: "wait until it has caught up"}
  test:
    signals: {proc.networks: 0, proc.running: true, node.reachable: false}

- id: node-rpc-path-broken
  title: Node healthy inside its container but unreachable from the host
  explains: [node-rpc-down, evm-rpc-down]
  severity: high
  symptoms: host RPC calls fail while the node answers on localhost inside the container
  match:
    all: ["node.unreachable_from_host == true"]
  confirm:
    - "docker port <container>; rpc laddr in config.toml (must bind 0.0.0.0 inside a container); host firewall"
  causes:
    - port mapping lost or changed, laddr bound to 127.0.0.1 inside the container, host firewall, network detached
  fix:
    - "[change] fix the port mapping / laddr (tcp://0.0.0.0:26657) and recreate or restart the container"
  verify:
    - "node.reachable true from the host"
  test:
    signals: {node.unreachable_from_host: true, node.reachable: false}
